<head>

<title>EL CIELO 在庫セール</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif; background: #f8f6f2; color: #2a2a2a; }
  header { background: linear-gradient(135deg, #1a1a2e, #0f3460); padding: 22px 20px 18px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
  header h1 { color: #fff; font-size: 20px; letter-spacing: 4px; font-family: Georgia, serif; }
  header p { color: #a8b2d8; font-size: 11px; margin-top: 4px; }
  .sale-tag { background: #e85d75; color: #fff; font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 14px; letter-spacing: 1px; }
  .toolbar { background: #fff; padding: 12px 16px; border-bottom: 1px solid #ede9e3; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filter-btn { padding: 5px 12px; border-radius: 16px; border: 1.5px solid #d0ccc5; background: #fff; color: #666; font-size: 12px; cursor: pointer; }
  .filter-btn.active { background: #4a4a8a; border-color: #4a4a8a; color: #fff; font-weight: 600; }
  .search { flex: 1; min-width: 160px; padding: 6px 12px; border: 1.5px solid #ddd; border-radius: 16px; font-size: 13px; outline: none; }
  .add-btn { margin-left: auto; padding: 7px 16px; background: linear-gradient(135deg, #4a4a8a, #7b5ea7); color: #fff; border: none; border-radius: 16px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .count { font-size: 11px; color: #aaa; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; padding: 16px; }
  .card { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.07); cursor: pointer; transition: transform 0.15s; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
  .card.sold { opacity: 0.6; }
  .photo-box { height: 180px; background: #f0eee8; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  .photo-box img { width: 100%; height: 100%; object-fit: cover; }
  .no-photo { color: #ddd; font-size: 40px; }
  .sold-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; }
  .sold-label { background: #fff; color: #888; border-radius: 20px; padding: 4px 14px; font-weight: 700; font-size: 13px; }
  .off-badge { position: absolute; top: 8px; right: 8px; background: #e85d75; color: #fff; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
  .card-body { padding: 10px 12px 14px; }
  .card-id { font-size: 10px; color: #fff; background: #4a4a8a; display: inline-block; padding: 2px 7px; border-radius: 5px; font-weight: 700; margin-bottom: 5px; }
  .card-name { font-size: 13px; font-weight: 600; color: #1a1a2e; line-height: 1.35; margin-bottom: 6px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 10px; font-weight: 700; }
  .s-available { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
  .s-hold { background: #fff8e1; color: #e65100; border: 1px solid #ffe082; }
  .s-sold { background: #fce4ec; color: #880e4f; border: 1px solid #f48fb1; }
  .card-meta { font-size: 11px; color: #999; margin-top: 5px; }
  .price-row { margin-top: 6px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .card-orig { font-size: 13px; color: #1a1a1a; font-weight: 600; text-decoration: line-through; text-decoration-color: #e85d75; text-decoration-thickness: 1.5px; }
  .card-sale { font-size: 17px; font-weight: 800; color: #e85d75; }
  .card-noprice { font-size: 12px; color: #aaa; }

  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 18px; width: min(95vw, 500px); max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 40px rgba(0,0,0,0.2); }
  .modal-header { padding: 20px 20px 0; display: flex; align-items: center; justify-content: space-between; }
  .modal-header h2 { font-size: 16px; color: #1a1a2e; }
  .modal-close { background: none; border: none; font-size: 22px; color: #aaa; cursor: pointer; }
  .modal-body { padding: 16px 20px 24px; }
  .modal-body label { display: block; font-size: 11px; font-weight: 600; color: #888; margin: 12px 0 4px; }
  .modal-body input, .modal-body select, .modal-body textarea { width: 100%; padding: 8px 10px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 13px; outline: none; }
  .modal-body textarea { height: 60px; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .photo-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .photo-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1.5px solid #eee; }
  .photo-hint { font-size: 10px; color: #aaa; margin-top: 4px; }
  .discount-hint { font-size: 11px; color: #7b5ea7; margin-top: 4px; }
  .save-btn { width: 100%; padding: 11px; background: linear-gradient(135deg, #4a4a8a, #7b5ea7); color: #fff; border: none; border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 16px; }
  .cancel-btn { width: 100%; padding: 9px; background: #f5f5f5; color: #666; border: none; border-radius: 9px; font-size: 13px; cursor: pointer; margin-top: 8px; }
  .delete-btn { width: 100%; padding: 9px; background: #fff; color: #c0392b; border: 1.5px solid #e0a0a0; border-radius: 9px; font-size: 13px; cursor: pointer; margin-top: 6px; }
  .empty { text-align: center; padding: 60px 20px; color: #bbb; grid-column: 1/-1; }

  /* 詳細表示（お客様向け・閲覧のみ） */
  .detail-photo-main { height: 60vh; max-height: 480px; background: #f0eee8; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .detail-photo-main img { width: 100%; height: 100%; object-fit: contain; }
  .detail-thumbs { display: flex; gap: 6px; padding: 10px 20px 0; flex-wrap: wrap; }
  .detail-thumbs img { width: 52px; height: 52px; object-fit: cover; border-radius: 6px; border: 1.5px solid #eee; cursor: pointer; }
  .detail-thumbs img.active { border-color: #4a4a8a; }
  .detail-body { padding: 16px 20px 24px; }
  .detail-id { font-size: 11px; color: #fff; background: #4a4a8a; display: inline-block; padding: 3px 9px; border-radius: 5px; font-weight: 700; margin-bottom: 8px; }
  .detail-name { font-size: 17px; font-weight: 700; color: #1a1a2e; line-height: 1.4; margin-bottom: 8px; }
  .detail-row { font-size: 13px; color: #666; margin-top: 6px; }
  .detail-row b { color: #333; }
  .detail-price-row { margin-top: 14px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .detail-orig { font-size: 15px; color: #1a1a1a; font-weight: 600; text-decoration: line-through; text-decoration-color: #e85d75; text-decoration-thickness: 1.5px; }
  .detail-sale { font-size: 24px; font-weight: 800; color: #e85d75; }
  .detail-off { display: inline-block; margin-top: 4px; background: #e85d75; color: #fff; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 12px; }
  .detail-notes { margin-top: 14px; font-size: 12px; color: #888; background: #f8f6f2; padding: 10px 12px; border-radius: 8px; line-height: 1.6; }

  .admin-toggle { position: fixed; right: 14px; bottom: 14px; width: 30px; height: 30px; border-radius: 50%; background: rgba(74,74,138,0.12); color: #4a4a8a; border: none; font-size: 13px; cursor: pointer; opacity: 0.45; z-index: 50; }
  .admin-toggle.on { opacity: 1; background: #4a4a8a; color: #fff; }
</style>
</head>
<body>

<header>
  <div>
    <h1>EL CIELO</h1>
    <p>在庫セール品一覧</p>
  </div>
</header>

<div class="toolbar">
  <button class="filter-btn active" onclick="setFilter('全て',this)">全て</button>
  <button class="filter-btn" onclick="setFilter('在庫あり',this)">在庫あり</button>
  <button class="filter-btn" onclick="setFilter('取置中',this)">取置中</button>
  <button class="filter-btn" onclick="setFilter('SOLD',this)">SOLD</button>
  <input class="search" type="text" placeholder="🔍 番号・商品名・サイズ・カラー..." oninput="doSearch(this.value)">
  <span class="count" id="countLabel"></span>
  <button class="add-btn" id="exportBtn" onclick="openExport()" style="display:none;background:#3d8b5f">📋 データ書き出し</button>
  <button class="add-btn" id="addBtn" onclick="openModal(null)" style="display:none">＋ 追加</button>
</div>

<div class="grid" id="grid"></div>

<!-- 詳細表示（お客様向け・閲覧のみ） -->
<div class="overlay" id="detailOverlay" onclick="closeOutsideDetail(event)">
  <div class="modal">
    <div class="modal-header">
      <h2>&nbsp;</h2>
      <button class="modal-close" onclick="closeDetail()">×</button>
    </div>
    <div class="detail-photo-main" id="detailPhotoMain"><div class="no-photo">✦</div></div>
    <div class="detail-thumbs" id="detailThumbs"></div>
    <div class="detail-body">
      <div class="detail-id" id="detailId"></div>
      <div class="detail-name" id="detailName"></div>
      <span class="badge" id="detailStatus"></span>
      <div class="detail-row"><b>サイズ:</b> <span id="detailSize"></span></div>
      <div class="detail-row" id="detailColorRow"><b>カラー:</b> <span id="detailColor"></span></div>
      <div class="detail-row"><b>裏地:</b> <span id="detailLining"></span></div>
      <div class="detail-price-row" id="detailPriceRow"></div>
      <div class="detail-notes" id="detailNotes" style="display:none"></div>
    </div>
  </div>
</div>

<!-- モーダル（管理者用の追加・編集。お客様には表示されません） -->
<div class="overlay" id="overlay" onclick="closeOutside(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">新規登録</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <label>商品名 *</label>
      <input id="f-name" placeholder="例：パープル×ベージュ フェザーデザイン">
      <label>カラー</label>
      <input id="f-color" placeholder="例：パープル×ベージュ×ホワイト">
      <div class="row2">
        <div><label>サイズ *</label><input id="f-size" placeholder="例：140"></div>
        <div><label>裏地</label><select id="f-lining"><option>なし</option><option>あり</option></select></div>
      </div>
      <label>販売価格（円・税込）</label>
      <input id="f-price" type="number" placeholder="45000">
      <label>ステータス</label>
      <select id="f-status">
        <option>在庫あり</option><option>取置中</option><option>SOLD</option>
      </select>
      <label>備考</label>
      <textarea id="f-notes" placeholder="大会名など"></textarea>

      <label>📸 写真URL（CloudinaryのURLを1行に1つ）</label>
      <textarea id="f-photos" placeholder="https://res.cloudinary.com/..." style="height:80px"></textarea>
      <div class="photo-hint">CloudinaryでアップロードしたURL（1行に1つ、複数枚OK）</div>
      <div class="photo-preview" id="photoPreview"></div>

      <button class="save-btn" onclick="saveItem()">保存する</button>
      <button class="cancel-btn" onclick="closeModal()">キャンセル</button>
      <button class="delete-btn" id="deleteBtn" onclick="deleteItem()" style="display:none">削除する</button>
    </div>
  </div>
</div>

<!-- データ書き出し（管理者用。写真などを追加した内容をClaudeに渡すため） -->
<div class="overlay" id="exportOverlay" onclick="closeOutsideExport(event)">
  <div class="modal">
    <div class="modal-header">
      <h2>データ書き出し</h2>
      <button class="modal-close" onclick="closeExport()">×</button>
    </div>
    <div class="modal-body">
      <div class="photo-hint">下の「コピーする」を押してから、Claudeとのチャットの入力欄に貼り付けて送ってください。</div>
      <textarea id="exportText" style="height:220px;font-size:10px;line-height:1.4" readonly></textarea>
      <button class="save-btn" onclick="copyExport()">📋 コピーする</button>
      <button class="cancel-btn" onclick="closeExport()">閉じる</button>
    </div>
  </div>
</div>

<button class="admin-toggle" id="adminToggle" onclick="toggleAdmin()" title="管理者用">⚙</button>

const STATUS_CLS = { "在庫あり":"s-available", "取置中":"s-hold", "SOLD":"s-sold" };

let items = [];
let editingId = null;
let currentFilter = "全て";
let currentSearch = "";
let editMode = false;
let detailPhotos = [];

(function init() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    const parsed = JSON.parse(saved);
    const savedIds = new Set(parsed.map(i => i.id));
    const newItems = INITIAL.filter(i => !savedIds.has(i.id));
    items = [...parsed, ...newItems];
  } else {
    items = JSON.parse(JSON.stringify(INITIAL));
  }
  render();
})();

function persist() { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }

function getRate(lining) { return DISCOUNT_RATE[lining] ?? 0.20; }
function getSalePrice(item) {
  if (!item.price) return null;
  const rate = getRate(item.lining);
  return Math.round(item.price * (1 - rate));
}

function render() {
  const filtered = items.filter(i => {
    const ms = currentFilter === "全て" || i.status === currentFilter;
    const q = currentSearch.toLowerCase();
    const mq = !q || [i.id, i.name, i.color, i.size, i.notes].some(v => v && v.toLowerCase().includes(q));
    return ms && mq;
  });

  document.getElementById("countLabel").textContent = filtered.length + "件";

  const grid = document.getElementById("grid");
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">該当する商品がありません</div>';
    return;
  }

  grid.innerHTML = filtered.map(item => {
    const sale = getSalePrice(item);
    const rate = getRate(item.lining);
    const photo = item.photos && item.photos[0];
    const sold = item.status === "SOLD";
    return `
      <div class="card${sold?' sold':''}" onclick="cardClick('${item.id}')">
        <div class="photo-box">
          ${photo ? `<img src="${photo}" alt="" loading="lazy">` : '<div class="no-photo">✦</div>'}
          ${sale ? `<div class="off-badge">-${Math.round(rate*100)}%</div>` : ''}
          ${sold ? '<div class="sold-overlay"><span class="sold-label">SOLD</span></div>' : ''}
        </div>
        <div class="card-body">
          <div class="card-id">${item.id}</div>
          <div class="card-name">${item.name}</div>
          <span class="badge ${STATUS_CLS[item.status]||'s-available'}">${item.status}</span>
          <div class="card-meta">Size: ${item.size||'—'} / 裏地: ${item.lining||'—'}</div>
          <div class="price-row">
            ${sale !== null
              ? `<span class="card-orig">¥${Number(item.price).toLocaleString()}</span><span class="card-sale">¥${sale.toLocaleString()}</span>`
              : `<span class="card-noprice">価格はお問い合わせください</span>`}
          </div>
        </div>
      </div>`;
  }).join('');
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function doSearch(v) { currentSearch = v; render(); }

function cardClick(id) {
  if (editMode) { openModal(id); } else { openDetail(id); }
}

function toggleAdmin() {
  editMode = !editMode;
  document.getElementById("adminToggle").classList.toggle("on", editMode);
  document.getElementById("addBtn").style.display = editMode ? "inline-block" : "none";
  document.getElementById("exportBtn").style.display = editMode ? "inline-block" : "none";
}

function openExport() {
  document.getElementById("exportText").value = JSON.stringify(items);
  document.getElementById("exportOverlay").classList.add("show");
  setTimeout(() => document.getElementById("exportText").select(), 50);
}
function closeExport() { document.getElementById("exportOverlay").classList.remove("show"); }
function closeOutsideExport(e) { if (e.target === document.getElementById("exportOverlay")) closeExport(); }
function copyExport() {
  const ta = document.getElementById("exportText");
  ta.select();
  ta.setSelectionRange(0, ta.value.length);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(ta.value).then(() => alert("コピーしました。チャットに貼り付けてください。")).catch(() => {
      document.execCommand('copy');
      alert("コピーしました。チャットに貼り付けてください。");
    });
  } else {
    document.execCommand('copy');
    alert("コピーしました。チャットに貼り付けてください。");
  }
}

function openDetail(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  const sale = getSalePrice(item);
  const rate = getRate(item.lining);

  document.getElementById("detailId").textContent = item.id;
  document.getElementById("detailName").textContent = item.name;
  const statusEl = document.getElementById("detailStatus");
  statusEl.textContent = item.status;
  statusEl.className = "badge " + (STATUS_CLS[item.status] || "s-available");
  document.getElementById("detailSize").textContent = item.size || "—";
  document.getElementById("detailLining").textContent = item.lining || "—";
  const colorRow = document.getElementById("detailColorRow");
  if (item.color) { colorRow.style.display = ""; document.getElementById("detailColor").textContent = item.color; }
  else { colorRow.style.display = "none"; }

  const priceRow = document.getElementById("detailPriceRow");
  priceRow.innerHTML = sale !== null
    ? `<div><span class="detail-orig">¥${Number(item.price).toLocaleString()}</span> <span class="detail-sale">¥${sale.toLocaleString()}</span><br><span class="detail-off">-${Math.round(rate*100)}% OFF</span></div>`
    : `<span class="card-noprice">価格はお問い合わせください</span>`;

  const notesEl = document.getElementById("detailNotes");
  if (item.notes) { notesEl.style.display = ""; notesEl.textContent = item.notes; }
  else { notesEl.style.display = "none"; }

  detailPhotos = (item.photos && item.photos.length) ? item.photos : [];
  renderDetailPhoto(0);
  const thumbs = document.getElementById("detailThumbs");
  thumbs.innerHTML = detailPhotos.length > 1
    ? detailPhotos.map((u,i) => `<img src="${u}" class="${i===0?'active':''}" onclick="renderDetailPhoto(${i})" onerror="this.style.display='none'">`).join('')
    : '';

  document.getElementById("detailOverlay").classList.add("show");
}

function renderDetailPhoto(i) {
  const main = document.getElementById("detailPhotoMain");
  const url = detailPhotos[i];
  main.innerHTML = url ? `<img src="${url}" alt="">` : '<div class="no-photo">✦</div>';
  document.querySelectorAll("#detailThumbs img").forEach((el, idx) => el.classList.toggle("active", idx === i));
}

function closeDetail() { document.getElementById("detailOverlay").classList.remove("show"); }
function closeOutsideDetail(e) { if (e.target === document.getElementById("detailOverlay")) closeDetail(); }

function openModal(id) {
  editingId = id;
  const item = id ? items.find(i => i.id === id) : null;
  document.getElementById("modalTitle").textContent = item ? "編集: " + item.id : "新規登録";
  document.getElementById("f-name").value = item?.name || "";
  document.getElementById("f-color").value = item?.color || "";
  document.getElementById("f-size").value = item?.size || "";
  document.getElementById("f-lining").value = item?.lining || "なし";
  document.getElementById("f-price").value = item?.price || "";
  document.getElementById("f-status").value = item?.status || "在庫あり";
  document.getElementById("f-notes").value = item?.notes || "";
  const photos = item?.photos || [];
  document.getElementById("f-photos").value = photos.join("\n");
  updatePhotoPreview(photos);
  document.getElementById("deleteBtn").style.display = item ? "block" : "none";
  document.getElementById("overlay").classList.add("show");
}

function updatePhotoPreview(photos) {
  const preview = document.getElementById("photoPreview");
  preview.innerHTML = photos.filter(u=>u).map(u => `<img src="${u}" onerror="this.style.display='none'">`).join('');
}

document.getElementById("f-photos").addEventListener("input", function() {
  const urls = this.value.split("\n").map(u=>u.trim()).filter(u=>u);
  updatePhotoPreview(urls);
});

function closeModal() { document.getElementById("overlay").classList.remove("show"); }
function closeOutside(e) { if (e.target === document.getElementById("overlay")) closeModal(); }

function getNextId() {
  const nums = items.map(i => parseInt(i.id.replace("ELC-",""))||0);
  return "ELC-" + String(Math.max(...nums)+1).padStart(3,"0");
}

function saveItem() {
  const name = document.getElementById("f-name").value.trim();
  const size = document.getElementById("f-size").value.trim();
  if (!name || !size) { alert("商品名とサイズは必須です"); return; }
  const photos = document.getElementById("f-photos").value.split("\n").map(u=>u.trim()).filter(u=>u);
  const data = {
    id: editingId || getNextId(),
    name,
    color: document.getElementById("f-color").value.trim(),
    size,
    lining: document.getElementById("f-lining").value,
    price: document.getElementById("f-price").value ? Number(document.getElementById("f-price").value) : null,
    status: document.getElementById("f-status").value,
    notes: document.getElementById("f-notes").value.trim(),
    photos,
    createdAt: editingId ? items.find(i=>i.id===editingId)?.createdAt : new Date().toISOString().slice(0,10),
  };
  items = editingId ? items.map(i => i.id===editingId ? data : i) : [...items, data];
  persist();
  render();
  closeModal();
}

function deleteItem() {
  if (!confirm(editingId + " を削除しますか？")) return;
  items = items.filter(i => i.id !== editingId);
  persist();
  render();
  closeModal();
}
</script>
</body>
</html>
